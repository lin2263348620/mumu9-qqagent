name: Feature request
description: 建议一个新能力或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 描述场景，而不是只给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 部署 / 启动
        - QQ 登录 / OneBot 连接
        - 模型调用
        - 人设 / 关系 / 互动
        - 管理后台界面
        - 文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束
      options:
        - label: 我理解本项目仅面向 Windows，且不提供 QQ 风控绕过
          required: true
